<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px 40px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #687386;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.balance {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  padding: 18px;
  border-radius: 15px;
  background: #f5f7fa;
}

.stat strong {
  display: block;
  font-size: 21px;
  margin-top: 7px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #2864e8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  margin-bottom: 12px;
  border: 1px solid #d6dce5;
  border-radius: 10px;
  font-size: 15px;
}

.transaction {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.income {
  color: #168447;
}

.expense {
  color: #d63c3c;
}

.hidden {
  display: none;
}
</style><script src="https://js.paystack.co/v2/inline.js"></script>p
</head>

<body>

<div class="app">

  <h1>Finance App</h1>
  <p class="subtitle">Manage your money easily.</p>

  <div id="welcome" class="card">
    <h2>Welcome 👋</h2>
    <p>Track your income, expenses and balance in one place.</p>
    <button onclick="openDashboard()">Get Started</button>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <p>Total Balance</p>
      <div class="balance" id="balance">₦0</div>
    </div>

    <div class="stats">
      <div class="stat">
        Income
        <strong class="income" id="income">₦0</strong>
      </div>

      <div class="stat">
        Expenses
        <strong class="expense" id="expenses">₦0</strong>
      </div>
    </div>

    <div class="card">
      <h2>Add Transaction</h2>

      <input id="description" type="text" placeholder="Description">

      <input id="amount" type="number" placeholder="Amount">

      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <button onclick="addTransaction()">Add Transaction</button>
    </div>

    <div class="card">
    <h2>Premium Subscription</h2>
    <p>Subscribe for ₦10,000 to unlock code generation.</p>
    <button onclick="payWithPaystack()">Subscribe — ₦10,000</button>
    <p id="paymentStatus"></p>
    </div><div class="card">
      <h2>Transactions</h2>
      <div id="transactions">
        <p>No transactions yet.</p>
      </div>
    </div>

  </div>

</div>

<script>

let transactions = [];

function openDashboard() {
  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
}

function addTransaction() {

  const description =
    document.getElementById("description").value;

  const amount =
    Number(document.getElementById("amount").value);

  const type =
    document.getElementById("type").value;

  if (!description || !amount) {
    alert("Please enter a description and amount.");
    return;
  }

  transactions.push({
    description: description,
    amount: amount,
    type: type
  });

  document.getElementById("description").value = "";
  document.getElementById("amount").value = "";

  updateApp();
}
function payWithPaystack() {
  const email = prompt("Enter your email for payment:");

  if (!email) {
    return;
  }

  const popup = new PaystackPop();

  popup.newTransaction({
    key: "pk_test_fc47527b55348e87f9bfbbe73ada1fe1a240f546",
    email: email,
    amount: 1000000,
    currency: "NGN",

    onSuccess: (transaction) => {
      document.getElementById("paymentStatus").innerText =
        "Payment successful! Premium unlocked.";

      alert("Payment successful! Your premium access is now unlocked.");
    },

    onCancel: () => {
      document.getElementById("paymentStatus").innerText =
        "Payment cancelled.";
    }
  });
}
function updateApp() {

  let income = 0;
  let expenses = 0;

  transactions.forEach(t => {

    if (t.type === "income") {
      income += t.amount;
    } else {
      expenses += t.amount;
    }

  });

  const balance = income - expenses;

  document.getElementById("income").textContent =
    "₦" + income.toLocaleString();

  document.getElementById("expenses").textContent =
    "₦" + expenses.toLocaleString();

  document.getElementById("balance").textContent =
    "₦" + balance.toLocaleString();

  const list = document.getElementById("transactions");

  if (transactions.length === 0) {
    list.innerHTML = "<p>No transactions yet.</p>";
    return;
  }

  list.innerHTML = "";

  transactions.forEach(t => {

    const div = document.createElement("div");

    div.className = "transaction";

    div.innerHTML =
      "<span>" + t.description + "</span>" +
      "<strong class='" + t.type + "'>" +
      (t.type === "income" ? "+" : "-") +
      "₦" + t.amount.toLocaleString() +
      "</strong>";

    list.appendChild(div);

  });
}

</script>

</body>
</html>
